# Four-node Cairn: one coordinator, node1..node4, RF=3, W=2 (overridable
# via CAIRN_REPLICATION_FACTOR / CAIRN_WRITE_QUORUM for scripts/bench.sh).
# Each node repeats CAIRN_HEARTBEAT_INTERVAL because a service environment
# block replaces the anchor's, it does not merge into it.
# make up / make smoke / make down (see Makefile).
x-node: &node
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  command: ["/storagenode"]
  depends_on:
    coordinator:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/storagenode", "-healthcheck"]
    interval: 2s
    timeout: 5s
    retries: 15
    start_period: 5s

services:
  coordinator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["/coordinator"]
    environment:
      CAIRN_ADDR: ":8080"
      CAIRN_DATA_DIR: /data
      CAIRN_REPLICATION_FACTOR: "${CAIRN_REPLICATION_FACTOR:-3}"
      CAIRN_WRITE_QUORUM: "${CAIRN_WRITE_QUORUM:-2}"
      CAIRN_HEARTBEAT_TIMEOUT: 3s
      CAIRN_REPAIR_INTERVAL: 2s
      CAIRN_REPAIR_GRACE: 10s
    ports:
      - "8080:8080"
    volumes:
      - coordinator-data:/data
    healthcheck:
      test: ["CMD", "/coordinator", "-healthcheck"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  node1:
    <<: *node
    environment:
      CAIRN_NODE_ID: node1
      CAIRN_ADDR: ":9000"
      CAIRN_ADVERTISE_ADDR: http://node1:9000
      CAIRN_COORDINATOR_URL: http://coordinator:8080
      CAIRN_HEARTBEAT_INTERVAL: 1s
      CAIRN_DATA_DIR: /data
    volumes:
      - node1-data:/data

  node2:
    <<: *node
    environment:
      CAIRN_NODE_ID: node2
      CAIRN_ADDR: ":9000"
      CAIRN_ADVERTISE_ADDR: http://node2:9000
      CAIRN_COORDINATOR_URL: http://coordinator:8080
      CAIRN_HEARTBEAT_INTERVAL: 1s
      CAIRN_DATA_DIR: /data
    volumes:
      - node2-data:/data

  node3:
    <<: *node
    environment:
      CAIRN_NODE_ID: node3
      CAIRN_ADDR: ":9000"
      CAIRN_ADVERTISE_ADDR: http://node3:9000
      CAIRN_COORDINATOR_URL: http://coordinator:8080
      CAIRN_HEARTBEAT_INTERVAL: 1s
      CAIRN_DATA_DIR: /data
    volumes:
      - node3-data:/data

  node4:
    <<: *node
    environment:
      CAIRN_NODE_ID: node4
      CAIRN_ADDR: ":9000"
      CAIRN_ADVERTISE_ADDR: http://node4:9000
      CAIRN_COORDINATOR_URL: http://coordinator:8080
      CAIRN_HEARTBEAT_INTERVAL: 1s
      CAIRN_DATA_DIR: /data
    volumes:
      - node4-data:/data

volumes:
  coordinator-data:
  node1-data:
  node2-data:
  node3-data:
  node4-data:
